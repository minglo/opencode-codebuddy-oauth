name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  # auto-tag 由 GITHUB_TOKEN 推 tag,其 push 事件不会触发本 workflow(防循环机制),
  # 故由 auto-tag 打完 tag 后通过 gh workflow run 显式呼叫
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC：npm 侧已信任 GitHub Actions，无 token 也能发布

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test
      - name: Skip if already published
        run: |
          PKG="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "$PKG"@"$VER" version >/dev/null 2>&1; then
            echo "version $VER already published, skip"
            echo "skip=true" >> "$GITHUB_ENV"
          fi
      # npm 只负责打包上传：--ignore-scripts 跳过 prepublishOnly，
      # 避免 npm 去调用 pnpm 脚本；构建与测试已在上面显式完成。
      - run: npm publish --provenance --ignore-scripts
        if: env.skip != 'true'
