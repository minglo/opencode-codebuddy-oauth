name: Auto Tag

on:
  push:
    branches: [master]

permissions:
  contents: write
  actions: write   # gh workflow run publish.yml 需要触发 workflow_dispatch 的权限

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "v=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - id: pkg
        run: echo "name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT
      - run: |
          TAG="${{ steps.ver.outputs.v }}"
          PKG="${{ steps.pkg.outputs.name }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG exists, skip"
          elif npm view "$PKG"@"${TAG#v}" version >/dev/null 2>&1; then
            echo "version ${TAG#v} already published, skip (bump version to publish)"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
            # GITHUB_TOKEN 推的 tag 不触发 publish.yml(push 事件被防循环机制抑制),
            # 显式 dispatch;--ref 指向刚推的 tag,checkout 即为待发布版本
            gh workflow run publish.yml --ref "$TAG"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
